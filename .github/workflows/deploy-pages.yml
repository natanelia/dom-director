name: Deploy public demo
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site-tests/**'
      - 'packages/core/**'
      - 'packages/studio/**'
      - 'studio-tests/**'
      - 'schemas/**'
      - 'demo/**'
      - 'tools/build_runtime.py'
      - 'tools/build_site.py'
      - 'tools/install_test_browser.sh'
      - 'tools/install_site_tools.sh'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/verify-public-demo.yml'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  # PRs never publish; obsolete test runs must not block the corrected revision.
  # Main-branch publication remains serialized and is never cancelled by this rule.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  acceptance:
    name: Public artifact acceptance in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build the allowlisted SDK site
        run: |
          bash tools/install_site_tools.sh
          python3 tools/build_runtime.py
          python3 tools/build_site.py
          python3 site-tests/deployment_contract_test.py
          node --test site-tests/model.test.mjs
      - name: Install browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash tools/install_test_browser.sh
      - name: Exercise the SDK consumer and exact staged artifact
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          python3 site-tests/browser_test.py
          python3 site-tests/storyboard_test.py
          python3 studio-tests/browser_test.py
          python3 studio-tests/review_test.py
          python3 site-tests/deployed_smoke.py --local-directory site-dist
      - name: Upload only the verified public artifact
        if: github.ref == 'refs/heads/main' && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-dist
          retention-days: 1
  deploy:
    name: Publish SDK demo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy verified SDK site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Record deployment and verification handoff
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## SDK demo deployed\n\n%s\n\nThe read-only Verify public playback workflow checks exact live bytes and browser behavior.\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
