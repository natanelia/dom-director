name: Deploy public demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-pages.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and package public demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify bundled demo and JavaScript
        run: |
          node --version
          node --check demo/src/model.js
          node --check demo/src/app.js
          python3 demo/build.py
          git diff --exit-code -- demo/index.html
          node --test demo/tests/model.test.cjs
      - name: Test demo in Chromium before publication
        run: |
          python3 -m pip install -r demo/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
          python3 demo/tests/browser_test.py
      - name: Stage only public demo files
        env:
          SITE_DIR: ${{ runner.temp }}/dom-director-pages
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil

          site = Path(os.environ['SITE_DIR'])
          site.mkdir(parents=True, exist_ok=False)
          for source, name in [('demo/index.html', 'index.html'), ('LICENSE', 'LICENSE.txt')]:
              source = Path(source)
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f'Expected a regular file: {source}')
              shutil.copyfile(source, site / name)
          (site / '.nojekyll').write_text('', encoding='utf-8')
          expected = {'.nojekyll', 'index.html', 'LICENSE.txt'}
          if {entry.name for entry in site.iterdir()} != expected:
              raise SystemExit('Unexpected file in public artifact')
          html = (site / 'index.html').read_bytes()
          if b'DOM Director' not in html or b'Not a video.' not in html:
              raise SystemExit('Expected DOM Director demo')
          for marker in [b'/*__CSS__*/', b'/*__MODEL__*/', b'/*__APP__*/', b'/*__DATA__*/']:
              if marker in html:
                  raise SystemExit('Unresolved build marker in demo')
          digest = hashlib.sha256(html).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Public artifact (not yet deployed)\n\n')
              summary.write('Only `index.html`, `LICENSE.txt`, and `.nojekyll` are included.\n\n')
              summary.write(f'Demo SHA-256: `{digest}`\n')
          PY
      - name: Upload demo-only Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/dom-director-pages
          retention-days: 1

  deploy:
    name: Publish and verify public site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Explain Pages setup failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo '::error::Check Settings > Pages > Build and deployment > Source: GitHub Actions. The standard workflow token cannot activate Pages for the first time.'
          echo 'Pages setup: https://github.com/natanelia/dom-director/settings/pages' >> "$GITHUB_STEP_SUMMARY"
          echo 'Keep the source repository private. Private-repository Pages requires an eligible GitHub plan.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public access without authentication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$PAGE_URL" -o public-demo.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('public-demo.html').read_bytes()
          if b'DOM Director' not in html or b'Not a video.' not in html:
              raise SystemExit('Public URL did not return the expected demo')
          PY
          printf '## Public demo verified\n\n%s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
