name: Studio canvas regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-canvas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canvas:
    name: Canvas geometry in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build the same allowlisted Studio fixture
        run: |
          bash tools/install_site_tools.sh
          python3 tools/build_runtime.py
          python3 tools/build_site.py
      - name: Install selected browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash tools/install_test_browser.sh
      - name: Exercise responsive geometry and error messages
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python3 studio-tests/canvas_test.py
      - name: Preserve synthetic diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canvas-${{ matrix.browser }}
          path: studio-results
          retention-days: 7
