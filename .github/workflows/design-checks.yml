name: Design and demo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Design contracts and 79 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned design-check dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate contracts, examples, links and traceability
        run: python3 tools/check_design.py
      - name: Run design tests
        run: python3 -m unittest discover -s tests -v

  demo:
    name: Demo model and Chromium tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Record environment and check JavaScript syntax
        run: |
          python3 --version
          node --version
          node --check demo/src/model.js
          node --check demo/src/app.js
      - name: Verify self-contained demo is current
        run: |
          python3 demo/build.py
          git diff --exit-code -- demo/index.html
      - name: Run 10 pure-model tests
        run: node --test demo/tests/model.test.cjs
      - name: Install pinned browser-test dependencies
        run: |
          python3 -m pip install -r demo/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Run 14 Chromium fixture tests
        run: python3 demo/tests/browser_test.py
