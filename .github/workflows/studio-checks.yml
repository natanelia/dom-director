name: Studio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build schemas and link the local core
        run: |
          python3 tools/build_runtime.py
          mkdir -p node_modules/@dom-director
          ln -s ../../packages/core node_modules/@dom-director/core
      - name: Deterministic rich-project and timeline tests
        run: node --test packages/studio/test/*.test.js
      - name: Pack and install actual local candidates
        run: python3 tools/check_studio.py
  browser:
    name: Studio editing in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build exact public Studio fixture
        run: |
          python3 tools/build_runtime.py
          bash tools/install_site_tools.sh
          python3 tools/build_site.py
          node --check site/studio.mjs
          node --check site/studio-view.mjs
      - name: Install selected browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash tools/install_test_browser.sh
      - name: Exercise editing, preview, media and project round trips
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python3 studio-tests/browser_test.py
      - name: Preserve synthetic Studio screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-${{ matrix.browser }}
          path: studio-results/
          if-no-files-found: ignore
          retention-days: 7
