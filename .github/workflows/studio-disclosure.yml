name: Studio disclosure regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  disclosure:
    name: Repeated disclosure in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build fixture and install browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          python3 tools/build_runtime.py
          bash tools/install_site_tools.sh
          python3 tools/build_site.py
          bash tools/install_test_browser.sh
      - name: Repeat actual caption and disclosure pointer actions
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python3 studio-tests/disclosure_test.py
      - name: Retain synthetic disclosure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disclosure-${{ matrix.browser }}
          path: studio-results/
          retention-days: 7
          if-no-files-found: ignore
