name: Studio video export
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: Chromium and FFmpeg export acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare the controlled fixture and approved media
        run: |
          python3 tools/build_runtime.py
          bash tools/install_site_tools.sh
          python3 tools/build_site.py
          mkdir -p node_modules/@dom-director
          ln -s ../../packages/core node_modules/@dom-director/core
      - name: Install pinned rendering browser
        env:
          BROWSER_ENGINE: chromium
        run: bash tools/install_test_browser.sh
      - name: Verify local video output and frame/audio parity
        run: |
          node --check tools/video-render-host.mjs
          python3 studio-tests/video_export_test.py
      - name: Preserve synthetic video evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: video-export-review
          path: video-results/
          if-no-files-found: ignore
          retention-days: 7
