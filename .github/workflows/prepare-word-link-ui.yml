name: Prepare exact word-link target repair
on:
  push:
    branches: [automation/word-link-ui-preparation]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'natanelia/dom-director' && github.ref == 'refs/heads/automation/word-link-ui-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Store checksum-verified repair blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          repo='natanelia/dom-director'
          assert os.environ['GITHUB_REPOSITORY']==repo
          expected={'site/studio.mjs':'e321eaf3d9aa77c23e6dd1187f6375f8fa9558c3',
                    'studio-tests/timing_link_test.py':'4d4f622a0fe0c091a4a4c15bd320d11bbf105d50',
                    'docs/studio-word-link-controls.md':'f52aa79fbef1b9ef42b8cdf9a51a8e076573fa74'}
          def sha(data):return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          patch=Path('.word-link-transfer/target-repair.patch').read_bytes()
          assert len(patch)==4585 and sha(patch)=='ef812ad615277ba7f023835e4d4f2e5104007bef'
          work=Path(os.environ['RUNNER_TEMP'])/'word-link-repair'
          subprocess.run(['git','worktree','add','--detach',str(work),'a2ee97c55e248cb642e614e48456c89c57bca97b'],check=True)
          def git(*args,**kwargs):return subprocess.run(['git','-C',str(work),*args],check=True,**kwargs)
          stats=git('apply','--numstat',input=patch,capture_output=True).stdout.decode()
          assert {line.split('\t',2)[2] for line in stats.splitlines()}==set(expected)
          git('apply','--check',input=patch);git('apply',input=patch)
          contents={}
          for path,digest in expected.items():
              f=work/path
              assert f.is_file() and not f.is_symlink() and f.resolve().is_relative_to(work)
              data=f.read_bytes();assert sha(data)==digest,path;contents[path]=data
          git('diff','--check')
          subprocess.run(['node','--check',str(work/'site/studio.mjs')],check=True)
          for path,data in contents.items():
              request=Request('https://api.github.com/repos/'+repo+'/git/blobs',method='POST',
                data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                         'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urlopen(request,timeout=30) as response:result=json.load(response)
              assert result['sha']==expected[path],path
          print('VERIFIED_FILE_BLOBS='+json.dumps(expected,sort_keys=True))
          PY
