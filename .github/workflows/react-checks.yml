name: React integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: react-${{ github.ref }}
  cancel-in-progress: true
jobs:
  react:
    name: React ${{ matrix.react }} in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {react: '18.3.1', scheduler: '0.23.2', browser: chromium}
          - {react: '19.3.1', scheduler: '0.28.0', browser: chromium}
          - {react: '19.3.1', scheduler: '0.28.0', browser: firefox}
          - {react: '19.3.1', scheduler: '0.28.0', browser: webkit}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build canonical schemas and test semantic store
        run: |
          python3 tools/build_runtime.py
          node --test packages/react/test/*.test.js
      - name: Install pinned test-only React and bundler packages
        env:
          REACT_VERSION: ${{ matrix.react }}
          SCHEDULER_VERSION: ${{ matrix.scheduler }}
        run: |
          npm install --prefix react-tests --ignore-scripts --no-package-lock --no-audit --no-fund "react@$REACT_VERSION" "react-dom@$REACT_VERSION" "scheduler@$SCHEDULER_VERSION" esbuild@0.28.2 loose-envify@1.4.0 js-tokens@4.0.0
          npm ls --prefix react-tests --depth=0
      - name: Build real consumer and verify server rendering
        run: |
          node react-tests/build.mjs
          node --test react-tests/dist/ssr.test.cjs
      - name: Install browser with bounded official-mirror downloads
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash tools/install_test_browser.sh
      - name: Strict Mode hydration portals and lifecycle browser tests
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python3 react-tests/browser_test.py
