name: Verify public playback
on:
  workflow_run:
    workflows: ['Deploy public demo']
    types: [completed]
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'
    name: Public SDK playback in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare canonical schemas and browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          python3 tools/build_runtime.py
          bash tools/install_test_browser.sh
      - name: Verify live bytes, playback and visual authoring without authentication
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          STORYBOARD_PUBLIC_URL: https://natanelia.github.io/dom-director/agent.html
        run: |
          python3 site-tests/deployed_smoke.py
          python3 site-tests/storyboard_test.py
