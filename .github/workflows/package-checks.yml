name: Package contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build schemas and verify generated authoring types
        run: |
          python3 tools/build_runtime.py
          python3 tools/build_types.py
          git diff --exit-code -- packages/core/src/script.generated.d.ts
          node --test packages/core/test/diagnostic-contract.test.js
      - name: Verify clean packed-package consumption and TypeScript contracts
        run: python3 tools/check_packages.py
