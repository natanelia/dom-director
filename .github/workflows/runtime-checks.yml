name: Runtime checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Core and ${{ matrix.browser }} runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pure runtime tests
        run: node --test packages/core/test/*.test.js
      - name: Install browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          python3 -m pip install -r demo/requirements-browser.txt
          python3 -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Browser integration
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python3 -m unittest discover -s runtime-tests -p '*_test.py' -v
