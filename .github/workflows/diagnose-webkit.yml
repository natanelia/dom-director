name: Diagnose WebKit playback
on:
  push:
    branches: [test/public-webkit-diagnostics]
    paths: ['.github/workflows/diagnose-webkit.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install WebKit
        run: |
          python3 -m pip install -r demo/requirements-browser.txt
          python3 -m playwright install --with-deps webkit
      - name: Trace public and fixture startup
        run: |
          python3 -u - <<'PY'
          import hashlib, json, threading
          from pathlib import Path
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          html = Path('demo/index.html').read_bytes()
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/html; charset=utf-8')
                  self.send_header('Content-Length', str(len(html)))
                  self.end_headers()
                  self.wfile.write(html)
              def log_message(self, *args): pass
          server = ThreadingHTTPServer(('127.0.0.1', 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          urls = [('public', 'https://natanelia.github.io/dom-director/?v=4d65f622e6fd67444d71b01728dd556cd6297271'), ('local', f'http://127.0.0.1:{server.server_port}/dom-director/')]
          trace = '''(() => {
            window.events = [];
            for (const type of ['pointerdown','pointerup','click','focusin','visibilitychange','pagehide']) {
              document.addEventListener(type, e => window.events.push({type, target:e.target.id || e.target.nodeName, time:performance.now(), hidden:document.hidden, active:document.activeElement?.id}), true);
            }
          })();'''
          sample = '''() => ({time:performance.now(), position:document.querySelector('#seek').value, state:document.querySelector('#stage').dataset.state, clock:document.querySelector('#stage').dataset.clock, focus:document.activeElement?.id, hidden:document.hidden, visibility:document.visibilityState, message:document.querySelector('#player-state').textContent, scroll:scrollY, events:window.events})'''
          with sync_playwright() as p:
              browser = p.webkit.launch()
              print('WebKit', browser.version)
              for origin, url in urls:
                  for mobile in (False, True):
                      for delay in (0, 200):
                          context = browser.new_context(viewport={'width':390 if mobile else 1440,'height':844 if mobile else 1100}, has_touch=mobile, is_mobile=mobile)
                          page = context.new_page()
                          errors=[]
                          page.on('pageerror', lambda e: errors.append(str(e)))
                          page.add_init_script(trace)
                          response = page.goto(url, wait_until='load')
                          assert response and response.ok and hashlib.sha256(response.body()).digest() == hashlib.sha256(html).digest()
                          if delay: page.wait_for_timeout(delay)
                          print('CASE', origin, mobile, delay, flush=True)
                          button=page.locator('#stage-play' if mobile else '#hero-play')
                          button.tap() if mobile else button.click()
                          for wait in (0,100,500,600,1200):
                              if wait: page.wait_for_timeout(wait)
                              print(json.dumps(page.evaluate(sample)), flush=True)
                          print('ERRORS', errors, flush=True)
                          context.close()
              browser.close()
          server.shutdown()
          PY
