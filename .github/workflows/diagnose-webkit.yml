name: Diagnose WebKit playback
on:
  push:
    branches: [test/public-webkit-diagnostics]
    paths: ['.github/workflows/diagnose-webkit.yml', 'demo/tests/deployed_smoke.py']
permissions:
  contents: read
jobs:
  diagnose:
    name: Repeated public playback in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          python3 -m pip install -r demo/requirements-browser.txt
          python3 -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Verify deployed bytes and sustained playback three times
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
          DEPLOYED_SHA: 4d65f622e6fd67444d71b01728dd556cd6297271
        run: |
          for attempt in 1 2 3; do
            echo "Public smoke attempt $attempt"
            python3 -u demo/tests/deployed_smoke.py
          done
