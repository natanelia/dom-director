name: Bootstrap bundled demo

# One-time source import helper. It only commits generated demo assets,
# never deploys a site, changes visibility, or publishes a package.
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-demo.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-dom-director-demo
  cancel-in-progress: false

jobs:
  bundle:
    if: github.repository == 'natanelia/dom-director' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install local narration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg
      - name: Generate and validate standalone demo
        run: |
          python3 demo/generate_audio.py
          python3 demo/build.py
          node --check demo/src/model.js
          node --check demo/src/app.js
          node --test demo/tests/model.test.cjs
          python3 -m pip install -r demo/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
          python3 demo/tests/browser_test.py
      - name: Commit only generated demo assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- demo/assets/narration.mp3 demo/assets/cues.json demo/index.html
          if git diff --cached --quiet; then
            echo 'Generated demo is already current.'
            exit 0
          fi
          git commit -m 'build(demo): bundle locally generated narration and standalone player'
          git push origin HEAD:main
