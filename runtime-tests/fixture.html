<!doctype html><html lang="en"><meta charset="utf-8"><title>Director runtime fixture</title>
<style>
body{margin:40px}#viewport{width:720px;height:400px;position:relative;overflow:hidden;border:5px solid black;margin-left:30px}
#scene{position:relative;width:1000px;height:700px;background:#eee}#target{position:absolute;left:480px;top:240px;width:130px;height:70px}
#overlay{position:fixed;inset:0;pointer-events:none}#portal{position:fixed;left:10px;top:10px}#scroller{position:absolute;left:20px;top:20px;width:140px;height:100px;overflow:auto}
</style>
<div id="viewport"><div id="scene"><div id="scroller"><div style="height:400px">Scrollable content</div></div><button id="target">Real target</button><input id="input" aria-label="Real input" style="position:absolute;left:10px;top:180px"></div></div>
<div id="controls"></div><div id="overlay"></div><button id="portal">Portal</button><button id="exit">Exit</button><dialog id="dialog"><button id="modal-target">Dialog target</button></dialog><div popover id="popover">Popover</div>
<script type="module">
import * as sdk from '../packages/core/src/index.js';window.sdk=sdk;window.clicks=0;document.querySelector('#target').onclick=()=>window.clicks++;
window.options=()=>({viewport:document.querySelector('#viewport'),scene:document.querySelector('#scene'),overlay:document.querySelector('#overlay')});
window.ready=true;
</script></html>
